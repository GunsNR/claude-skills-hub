<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Smart OS — Dilshan</title>
<style>
  :root{--bg:#0f1117;--card:#181b25;--card2:#1e2230;--text:#e8eaf2;
    --dim:#8a90a6;--accent:#6ee7b7;--warn:#fbbf24;--radius:16px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:17px;line-height:1.5;max-width:680px;margin:0 auto;
    padding:20px 16px 80px}
  h1{font-size:22px;margin-bottom:4px}
  .sub{color:var(--dim);font-size:14px;margin-bottom:20px}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;
    margin-bottom:10px}
  .card .title{font-weight:600}
  .card .meta{color:var(--dim);font-size:13px;margin:2px 0 10px}
  .card .details{color:var(--dim);font-size:14px;white-space:pre-wrap;
    margin-bottom:10px}
  .btn{border:0;border-radius:12px;padding:10px 16px;font-size:14px;
    font-weight:700;cursor:pointer;margin-right:8px}
  .btn.done{background:#143828;color:var(--accent)}
  .btn.block{background:#3a2c12;color:var(--warn)}
  .empty{color:var(--dim);padding:8px 4px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:#06281c;font-weight:700;
    padding:12px 24px;border-radius:999px;opacity:0;transition:.3s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<h1>Dilshan — Work Queue</h1>
<div class="sub" id="count"></div>
<div id="list"></div>
<div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const api = (p,o) => fetch('/api/ceo'+p,o).then(r=>r.json());
const post = (p,b) => api(p,{method:'POST',
  headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});

function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

async function load(){
  const tasks = await api('/tasks?owner=dilshan');
  $('count').textContent = `${tasks.length} open task${tasks.length===1?'':'s'}`;
  const list = $('list'); list.innerHTML='';
  if(!tasks.length){
    list.innerHTML = '<div class="empty">Queue is clear 🎉</div>'; return;
  }
  tasks.forEach(t=>{
    const d = document.createElement('div'); d.className='card';
    d.innerHTML = `<div class="title"></div>
      <div class="meta">${t.category} · ~${t.minutes} min</div>`;
    d.querySelector('.title').textContent = t.title;
    const done = document.createElement('button');
    done.className='btn done'; done.textContent='Done ✓';
    done.onclick = async ()=>{
      const note = prompt('One-line status / anything Izzy should know? (optional)') || null;
      await post(`/tasks/${t.id}/done`, note ? {learning: note} : {});
      toast('Marked done ✓'); load();
    };
    const block = document.createElement('button');
    block.className='btn block'; block.textContent='⚠ Blocked';
    block.onclick = async ()=>{
      const note = prompt('What are you blocked on?');
      if(!note) return;
      await post(`/tasks/${t.id}/blocker`, {note});
      toast('Izzy has been pinged');
    };
    d.append(done, block);
    list.appendChild(d);
  });
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
